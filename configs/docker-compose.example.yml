services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: risk
      POSTGRES_DB: risk_signal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ../backend
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "8787:8787"

volumes:
  postgres_data:
