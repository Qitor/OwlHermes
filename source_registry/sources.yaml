  - id: apollo_blog
    name: Apollo Research Blog
    category: frontier_eval_lab
    modality: web_article
    url: https://www.apolloresearch.ai/blog/
    feed_url: null
    collector: web_index
    priority: high
    refresh_interval: daily
    enabled: true
    risk_focus: [scheming, deception, oversight, evals, governance]
    helper_type: scrapling_official_page
    scrapling_url: https://www.apolloresearch.ai/blog/
    max_items: 10
    lookback_days: 30
    known_issues: R1-08 found no recent items in the last 7 days; blog may update infrequently.
    access_status: degraded
    collection_frequency: weekly
    primary_collection_method: browser_list_page
    fallback_methods: [search_fallback]
    failure_policy:
      max_attempts: 1
      timeout_seconds: 15
      on_failure: skip
    known_failures:
      - type: http_403
        message: 403 Forbidden on scrapling helper
        observed_in_round: R1-09
        recommended_action: Browse manually or use search fallback
      - type: stale_content
        message: Last post 2026-01-20, very low update frequency
        recommended_action: Check weekly instead of daily
    notes_for_hermes: Scrapling helper returns 403. Browse manually or search. Updates very infrequently.
    extractor_strategy:
      diff_mode: list_items
      requires_js: false
      rate_limit_seconds: 10
    notes: Apollo 重点关注 scheming frontier AI、monitoring、安全产品和治理。

  - id: anthropic_news
    name: Anthropic News / Research / Safety
    category: frontier_ai_lab
    modality: web_article
    url: https://www.anthropic.com/news
    feed_url: null
    collector: web_index
    priority: high
    refresh_interval: daily
    enabled: true
    risk_focus: [rsp, model_release, system_card, alignment, interpretability, policy]
    helper_type: scrapling_official_page
    scrapling_url: https://www.anthropic.com/news
    link_include_patterns: ["/news/", "/research/", "/policy/"]
    max_items: 10
    lookback_days: 14
    known_issues: Direct article URL construction may return 404; prefer extracting links from official news page listing.
    access_status: degraded
    collection_frequency: daily
    primary_collection_method: browser_list_page
    fallback_methods: [search_fallback]
    failure_policy:
      max_attempts: 1
      timeout_seconds: 15
      on_failure: fallback
    known_failures:
      - type: ssl_error
        message: SSL EOF error on scrapling helper
        observed_in_round: R1-09
        recommended_action: Browse manually to list page, extract links from there
    notes_for_hermes: Scrapling helper fails with SSL EOF. Must browse list page manually to extract article links.
    extractor_strategy:
      diff_mode: list_items
      requires_js: false
      rate_limit_seconds: 10
    notes: 关注 Responsible Scaling Policy、system card、Claude 安全评估、policy posts。

  - id: openai_news
    name: OpenAI News / Research / Safety
