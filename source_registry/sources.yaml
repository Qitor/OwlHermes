  - id: arxiv_ai_safety
    name: arXiv AI Safety Query
    category: academic
    modality: arxiv_paper
    url: https://export.arxiv.org/api/query
    feed_url: null
    collector: arxiv
    priority: medium
    refresh_interval: daily
    enabled: true
    risk_focus: [ai_safety, alignment, agents, cyber, biosecurity, evals, deception]
    query: '(cat:cs.AI OR cat:cs.LG OR cat:cs.CL OR cat:cs.CR) AND ("AI safety" OR "frontier model" OR "agent safety" OR alignment OR deception OR "model evaluation" OR cyber OR biosecurity OR scheming OR sabotage)'
    helper_type: arxiv_query
    max_items: 20
    lookback_days: 7
    access_status: degraded
    collection_frequency: daily
    primary_collection_method: arxiv_api
    fallback_methods: [search_fallback, manual]
    failure_policy:
      max_attempts: 2
      timeout_seconds: 45
      on_failure: fallback
    known_failures:
      - type: rate_limit
        message: API frequently rate-limited or user-policy blocked
        observed_in_round: R1-05
        recommended_action: Fall back to browser search or OAI-PMH endpoint
    notes_for_hermes: arXiv API is rate-limited. If helper fails, use browser to search arXiv directly.
    extractor_strategy:
      diff_mode: api_items
      requires_js: false
      rate_limit_seconds: 3
    notes: 使用 arXiv API，注意访问频率。

