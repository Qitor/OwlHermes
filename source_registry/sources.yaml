  - id: metr_evaluations
    name: METR Evaluations
    category: frontier_eval_lab
    modality: web_article
    url: https://metr.org/evaluations/
    feed_url: null
    collector: web_index
    priority: high
    refresh_interval: daily
    enabled: true
    risk_focus: [autonomy, ai_rnd, eval_integrity, catastrophic_risk]
    access_status: ok
    collection_frequency: biweekly
    primary_collection_method: browser_list_page
    known_failures:
      - type: stale_content
        message: Last update Nov 2025
        recommended_action: Check biweekly instead of daily
    extractor_strategy:
      diff_mode: list_items
      requires_js: false
      rate_limit_seconds: 10
    notes: 关注 frontier model evaluation reports、time horizon、AI R&D、sabotage、monitorability。

